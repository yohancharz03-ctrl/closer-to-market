        // DRAGGABLE FLOATING LIVE STORY WIDGET
        let isDragging = false, dragStartX = 0, dragStartY = 0, widgetInitialX = 0, widgetInitialY = 0;
        function initDrag(e) {
            isDragging = true;
            const widget = document.getElementById('floating-live-story-widget');
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            dragStartX = clientX;
            dragStartY = clientY;
            let rect = widget.getBoundingClientRect();
            widgetInitialX = rect.left;
            widgetInitialY = rect.top;
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onDragMove);
            document.addEventListener('touchend', onDragEnd);
        }
        function onDragMove(e) {
            if(!isDragging) return;
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            let dx = clientX - dragStartX;
            let dy = clientY - dragStartY;
            const widget = document.getElementById('floating-live-story-widget');
            widget.style.left = (widgetInitialX + dx) + 'px';
            widget.style.top = (widgetInitialY + dy) + 'px';
            widget.style.right = 'auto';
        }
        function onDragEnd() {
            isDragging = false;

const DICT={'Soko':'Market','Ujumbe':'Messages','Akaunti':'Account','Oda':'Orders','Mikoani':'Regions','Karibu kwenye soko lako la karibu':'Welcome to your nearby market','Angalia Maduka (Soko)':'Browse Shops','Sign In / Ingia kwenye Akaunti':'Sign In','Sajili Akaunti Mpya':'Create New Account','Ingia kwenye Akaunti':'Sign in to your account','Ingia Sasa':'Sign In Now','Neno la Siri (Password):':'Password:','Huna akaunti? Jisajili hapa':"No account? Register here",'Ujumbe & Mazungumzo':'Messages & Chats','Tuma':'Send','Andika ujumbe wako...':'Type your message...','Kikapu':'Cart','Toka (Sign Out)':'Sign Out','Oda Zilizopokelewa':'Received Orders','Tuma Mzigo':'Ship Order','Lipa (Wallet)':'Pay (Wallet)','Angalia bidhaa →':'View products →','Tafuta bidhaa, duka, au huduma yoyote...':'Search products, shops or services...','Jibu story...':'Reply to story...','Fungua Admin Panel':'Open Admin Panel','Setting':'Settings','Akaunti ya Mteja':'Customer Account'};
let lang=localStorage.getItem('ctm_lang')||'sw',orig=new WeakMap();
function applyLang(root){const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=n.nodeValue.trim();if(!t)continue;let o=orig.get(n);if(o===undefined){if(!DICT[t])continue;o=n.nodeValue;orig.set(n,o);}const k=o.trim();n.nodeValue=lang==='en'&&DICT[k]?o.replace(k,DICT[k]):o;}
  document.querySelectorAll('input[placeholder]').forEach(i=>{if(!i._p)i._p=i.placeholder;i.placeholder=lang==='en'&&DICT[i._p]?DICT[i._p]:i._p;});}
function setTheme(l){document.documentElement.classList.toggle('light',l);localStorage.setItem('ctm_theme',l?'light':'dark');const b=$('theme-btn');if(b)b.textContent=l?'🌙':'☀️';}
window.addEventListener('DOMContentLoaded',()=>{const g=document.querySelector('header > div:last-child');
  
  setTheme(localStorage.getItem('ctm_theme')==='light');applyLang();});
window.ctmTheme=()=>setTheme(!document.documentElement.classList.contains('light'));
window.ctmLang=()=>{lang=lang==='sw'?'en':'sw';localStorage.setItem('ctm_lang',lang);applyLang();};
const _r2=window.renderCurrentTab;window.renderCurrentTab=function(){_r2();applyLang();};
})();

</script>
<script>
/* ===== CTM V13: Dalali (brokers) + Wallet salama ===== */
(function(){
const C=window.__ctm,$=id=>document.getElementById(id),esc=C.esc,fmt=n=>'TZS '+Math.round(+n||0).toLocaleString();
const USSD='*150*00#'; /* badilisha na USSD ya mobile money aggregator wako */
const ens=()=>{const S=C.S;S.invites=S.invites||[];S.requests=S.requests||[];return S;};
const find=id=>C.S.accounts.find(a=>a.id===id);
const done=()=>{C.persist();C.hydrate();renderCurrentTab();};
const card='bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2';
const btn=(c,t,f)=>`<button onclick="${f}" class="${c} font-extrabold text-[11px] px-3 py-2 rounded-xl">${t}</button>`;
const inp=(id,ph,t)=>`<input id="${id}" type="${t||'text'}" placeholder="${ph}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">`;

/* ---------- Mwenye duka: usimamizi wa madalali ---------- */
window.renderSubShopsManager=function(){
  hideFloatingWidgetOnOtherPages();const S=ens(),me=C.me;
  const bs=S.accounts.filter(a=>a.role==='dalali'&&a.parentId===me.id);
  const inv=S.invites.filter(i=>i.vendorId===me.id&&i.status==='invited');
  const rq=S.requests.filter(r=>r.vendorId===me.id&&r.status==='pending');
  return `<div class="p-4 space-y-3 w-full max-w-md md:max-w-xl mx-auto pb-24">
  <div class="flex items-center justify-between border-b border-slate-800 pb-3"><h3 class="font-bold text-sm text-emerald-400">Madalali (Sub-Shops)</h3>${btn('bg-emerald-500 text-slate-950 text-base leading-none','+',"document.getElementById('broker-form').classList.toggle('hidden')")}</div>
  <div id="broker-form" class="hidden ${card}"><p class="text-xs font-bold text-white">Ongeza Dalali Mpya</p>${inp('bf-name','Jina la dalali')}${inp('bf-email','Email','email')}${inp('bf-phone','Namba ya simu','tel')}${inp('bf-pct','Commission % (mf. 10)','number')}
   ${btn('bg-emerald-500 text-slate-950 w-full','Tengeneza & Tuma kwa WhatsApp','ctmBrokerSave()')}</div>
  ${rq.length?`<p class="text-[11px] text-amber-300 font-bold">Maombi ya Bidhaa (${rq.length})</p>`+rq.map(r=>{const p=S.products.find(x=>x.id===r.productId),b=find(r.brokerId);return `<div class="${card}"><p class="text-xs text-white"><b>${esc(b?b.name:'')}</b> anaomba <b>${r.qty}</b> x ${esc(p?p.name:'')} (stock yako: ${p?p.stock:0})</p><div class="flex gap-2">${btn('bg-emerald-500 text-slate-950','Kubali',`ctmReq(${r.id},1)`)}${btn('bg-slate-800 text-red-400','Kataa',`ctmReq(${r.id},0)`)}</div></div>`;}).join(''):''}
  ${bs.map(b=>`<div class="${card}"><div class="flex justify-between"><p class="text-xs font-bold text-white">${esc(b.name)}</p><span class="text-[10px] ${b.isApproved?'text-emerald-400':'text-amber-300'}">${b.suspended?'Amesimamishwa':b.isApproved?'Hai':'Anasubiri idhini'}</span></div><p class="text-[11px] text-slate-400">${esc(b.phone)} - Commission ${b.pct}% - Mapato: ${fmt(S.orders.filter(o=>o.brokerId===b.id&&o.credited).reduce((s,o)=>s+o.commission,0))}</p>${b.isApproved?'':btn('bg-emerald-500 text-slate-950','Thibitisha & Fungua Akaunti',`ctmApproveBroker(${b.id})`)}${b.isApproved?btn('bg-slate-800 text-red-400',b.suspended?'Rudisha':'Simamisha',`ctmBrokerSusp(${b.id})`):''}</div>`).join('')}
  ${inv.map(i=>`<div class="${card}"><p class="text-xs text-white">${esc(i.name)} - msimbo <b class="text-emerald-400">${i.code}</b> (haijatumika)</p>${btn('bg-slate-800 text-emerald-400',"Tuma tena WhatsApp",`ctmShareInvite('${i.code}')`)}</div>`).join('')}
  ${!bs.length&&!inv.length?'<p class="text-xs text-slate-400 text-center py-8">Bado huna dalali. Bonyeza + kuongeza.</p>':''}</div>`;
};
window.ctmShareInvite=code=>{const S=ens(),i=S.invites.find(x=>x.code===code),me=C.me;
  window.open('https://wa.me/?text='+encodeURIComponent(`Habari ${i.name}, nakualika kuwa dalali wa ${me.shopName} (commission ${i.pct}%) kwenye Closer Market. Fungua ${location.origin+location.pathname}, bonyeza "Nina msimbo wa Dalali" na weka msimbo: ${code}`),'_blank');};
window.ctmBrokerSave=()=>{const S=ens(),g=i=>$(i).value.trim(),pct=+g('bf-pct');
  if(!g('bf-name')||!g('bf-email')||!g('bf-phone'))return alert('Jaza jina, email na simu.');
  if(!(pct>0&&pct<=50))return alert('Commission iwe kati ya 1 na 50.');
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  S.invites.push({code,vendorId:C.me.id,vendorUid:C.me.uid,name:g('bf-name').replace(/[<>"'`]/g,''),email:g('bf-email').toLowerCase(),phone:g('bf-phone').replace(/[<>"'`]/g,''),pct,status:'invited'});
  C.persist();C.hydrate();renderCurrentTab();ctmShareInvite(code);};
window.ctmApproveBroker=id=>{const b=find(id);if(!b||b.parentId!==C.me.id)return;b.isApproved=true;const i=ens().invites.find(x=>x.brokerId===id);if(i)i.status='active';
  C.notify(id,'Akaunti ya Dalali Imefunguliwa','Usajili',`${esc(C.me.shopName)} amekubali. Sasa unaweza kuomba bidhaa.`);done();};
window.ctmReq=(id,ok)=>{const S=ens(),r=S.requests.find(x=>x.id===id),p=S.products.find(x=>x.id===r.productId),b=find(r.brokerId);if(!r||r.vendorId!==C.me.id||r.status!=='pending')return;
  if(ok){if(!p||p.stock<r.qty)return alert('Stock haitoshi.');p.stock-=r.qty;
    let q=S.products.find(x=>x.vendorId===b.id&&x.parentProductId===p.id);
    if(q)q.stock+=r.qty;else S.products.unshift({id:C.nid(),name:p.name,price:p.price,category:p.category,stock:r.qty,image:p.image,isWishlisted:false,freeDelivery:p.freeDelivery,hasReel:false,vendorId:b.id,shopName:b.shopName,parentProductId:p.id});}
  r.status=ok?'accepted':'rejected';C.notify(b.id,ok?'Ombi la Bidhaa Limekubaliwa':'Ombi la Bidhaa Limekataliwa','Oda & Malipo',`${esc(p?p.name:'')} x${r.qty}`);done();};

/* ---------- Dalali: kujiunga kwa msimbo ---------- */
window.ctmBrokerJoin=()=>{let o=$('bj');if(o)o.remove();o=document.createElement('div');o.id='bj';o.className='fixed inset-0 z-[260] bg-black/80 flex items-center justify-center p-4';
  o.innerHTML=`<div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm space-y-3"><p class="text-sm font-black text-emerald-400">Jiunge kama Dalali</p>${inp('bj-code','Msimbo wa mwaliko')}${inp('bj-pw','Tengeneza neno la siri (6+)','password')}<div class="flex gap-2">${btn('bg-emerald-500 text-slate-950 flex-1','Tuma Ombi','ctmBrokerSubmit()')}${btn('bg-slate-800 text-slate-300','Funga',"document.getElementById('bj').remove()")}</div></div>`;document.body.appendChild(o);};
window.ctmBrokerSubmit=()=>{const S=ens(),code=$('bj-code').value.trim().toUpperCase(),pw=$('bj-pw').value;
  const i=S.invites.find(x=>x.code===code&&x.status==='invited');if(!i)return alert('Msimbo si sahihi au umeshatumika.');
  if(pw.length<6)return alert('Neno la siri liwe herufi 6+.');
  if(S.accounts.some(a=>a.email===i.email))return alert('Email hii ina akaunti tayari.');
  const p=find(i.vendorId),a={id:C.nid(),role:'dalali',parentId:p.id,pct:i.pct,name:i.name,phone:i.phone,email:i.email,pass:C.hash(pw),shopName:`${p.shopName} - ${i.name}`,location:p.location,lat:p.lat,lng:p.lng,locMarked:true,imgUrl:p.imgUrl,coverUrl:p.coverUrl,coverType:p.coverType,isApproved:false,baseDeliveryFee:p.baseDeliveryFee,distanceKm:p.distanceKm,paidUntil:Date.now()+30*864e5,subShops:[],selectedRegions:p.selectedRegions||[],walletBalance:0,rewards:[],cart:[],wishlist:[],following:[],tx:[],bio:'',joined:new Date().toLocaleDateString('en-GB')};
  i.status='submitted';i.brokerId=a.id;S.accounts.push(a);C.notify(p.id,'Dalali Anasubiri Idhini','Usajili',`${esc(a.name)} amejisajili kwa msimbo wako. Thibitisha kwenye Madalali.`);C.persist();
  sessionStorage.setItem('ctm_session_v11',String(a.id));$('bj').remove();C.hydrate();switchTab('broker_hub');};

/* ---------- Akaunti ya dalali ---------- */
window.renderBrokerHub=function(){
  hideFloatingWidgetOnOtherPages();const S=ens(),me=C.me,p=find(me.parentId),mine=S.orders.filter(o=>o.brokerId===me.id);
  const earned=mine.filter(o=>o.credited).reduce((s,o)=>s+o.commission,0),days=Math.ceil((me.paidUntil-Date.now())/864e5);
  const cat=S.products.filter(x=>x.vendorId===p.id&&x.stock>0),rq=S.requests.filter(r=>r.brokerId===me.id).slice(0,6);
  return `<div class="p-4 space-y-3 w-full max-w-md md:max-w-xl mx-auto pb-24">
  <div class="${card}"><p class="text-xs text-slate-400">Dalali wa</p><p class="text-sm font-black text-emerald-400">${esc(p.shopName)}</p><p class="text-[11px] text-slate-300">Commission ${me.pct}% - Mapato: <b>${fmt(earned)}</b> - Wallet: ${fmt(me.walletBalance)}</p>
   <p class="text-[11px] ${days<=7?'text-amber-300':'text-slate-400'}">Ada ya duka: siku ${Math.max(days,0)} ${btn('bg-emerald-500 text-slate-950 ml-2','Lipa TZS 10,000','ctmPayFee()')}</p>
   ${me.isApproved?'':'<p class="text-[11px] text-amber-300">Inasubiri mwenye duka akuidhinishe. Duka lako halionekani bado.</p>'}</div>
  ${me.isApproved?`<p class="text-xs font-bold text-white">Omba Bidhaa Kutoka Duka Kuu</p>${cat.map(x=>`<div class="${card} flex items-center gap-2"><img src="${x.image}" class="w-11 h-11 rounded-lg object-cover"><div class="flex-1 min-w-0"><p class="text-xs text-white truncate">${esc(x.name)}</p><p class="text-[10px] text-slate-400">${fmt(x.price)} - stock ${x.stock}</p></div><input id="rq-${x.id}" type="number" min="1" max="${x.stock}" value="1" class="w-14 bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-white">${btn('bg-emerald-500 text-slate-950','Omba',`ctmAskProduct(${x.id})`)}</div>`).join('')||'<p class="text-xs text-slate-400">Hakuna bidhaa.</p>'}`:''}
  ${rq.length?`<p class="text-xs font-bold text-white">Maombi Yangu</p>`+rq.map(r=>{const x=S.products.find(y=>y.id===r.productId);return `<p class="text-[11px] text-slate-300">${esc(x?x.name:'')} x${r.qty} - ${r.status}</p>`;}).join(''):''}
  <p class="text-xs font-bold text-white pt-2">Maagizo & Commission (${mine.length})</p>
  ${mine.map(o=>`<div class="${card}"><div class="flex justify-between text-[10px] text-slate-500"><span>${o.id}</span><span>${o.date}</span></div><p class="text-xs text-white">${esc(o.items)} - ${fmt(o.total)}</p><p class="text-[11px] text-emerald-400">Commission: ${fmt(o.commission)} <span class="text-slate-400">(${o.credited?'imelipwa':o.status})</span></p></div>`).join('')||'<p class="text-xs text-slate-400">Bado hakuna mauzo.</p>'}</div>`;
};
window.ctmAskProduct=id=>{const S=ens(),me=C.me,qty=Math.floor(+$('rq-'+id).value);if(!(qty>0))return;
  S.requests.push({id:C.nid(),brokerId:me.id,vendorId:me.parentId,productId:id,qty,status:'pending'});C.notify(me.parentId,'Ombi la Bidhaa kutoka kwa Dalali','Oda & Malipo',`${esc(me.name)} anaomba bidhaa. Fungua Madalali.`);C.persist();alert('Ombi limetumwa');renderCurrentTab();};

/* ---------- Wallet yenye password ---------- */
const pwOk=()=>{const me=C.me;if(me.lockUntil>Date.now()){alert('Wallet imefungwa kwa muda. Jaribu baadaye.');return false;}
  if(C.hash($('w-pw').value)===me.pass){me.failN=0;return true;}
  me.failN=(me.failN||0)+1;if(me.failN>=3){me.lockUntil=Date.now()+5*6e4;me.failN=0;}C.persist();alert('Neno la siri si sahihi.');return false;};
const tx=(t,a,n)=>{const me=C.me;me.tx=me.tx||[];me.tx.unshift({t,a,n,ts:Date.now()});me.tx=me.tx.slice(0,30);};
window.renderWallet=function(){
  hideFloatingWidgetOnOtherPages();const me=C.me,canW=me.role==='vendor'||me.role==='dalali'||me.role==='admin';
  return `<div class="p-4 space-y-3 w-full max-w-md mx-auto pb-24"><div class="${card} text-center"><p class="text-[11px] text-slate-400">Salio la Wallet</p><p class="text-2xl font-black text-emerald-400">${fmt(me.walletBalance)}</p></div>
  <div class="${card}">${inp('w-amt','Kiasi (TZS)','number')}${inp('w-pw','PIN ya Wallet (4-6 namba)','password')}<div class="flex gap-2">${btn('bg-emerald-500 text-slate-950 flex-1','Weka Pesa (USSD)','ctmDeposit()')}${canW?btn('bg-slate-800 text-amber-400 flex-1','Toa Pesa','ctmWithdraw()'):''}</div>${canW?'<p class="text-[10px] text-slate-500">Kutoa Hakuna kikomo cha kutoa. Makato ya mtandao wa simu yanakatwa na laini yako; CTM haihusiki.</p>':'<p class="text-[10px] text-slate-500">Akaunti ya mteja inaweza kuweka pesa tu, haiwezi kutoa. Unarudishiwa 1% ya manunuzi ya kila mwezi.</p>'}</div>
  ${(me.tx||[]).map(x=>`<div class="flex justify-between text-[11px] border-b border-slate-800 py-1.5"><span class="text-slate-300">${esc(x.n)}</span><span class="${x.a>0?'text-emerald-400':'text-red-400'} font-bold">${x.a>0?'+':''}${fmt(x.a)}</span></div>`).join('')}</div>`;
};
const amt=()=>Math.floor(+$('w-amt').value);
window.ctmDeposit=()=>{const a=amt();if(!(a>=1000))return alert('Kiwango cha chini TZS 1,000.');if(!pwOk())return;
  const l=document.createElement('a');l.href='tel:'+USSD.replace('#','%23');l.click(); /* fungua dialer ya USSD */
  /* JARIBIO: production lazima salio liongezwe na callback ya aggregator, si hapa */
  setTimeout(()=>{ctmAsk('Umekamilisha malipo kwa USSD? (hali ya majaribio)',()=>{C.me.walletBalance=(C.me.walletBalance||0)+a;tx('Deposit (USSD)',a,'Deposit (USSD)');C.persist();C.hydrate();renderCurrentTab();});},600);};
window.ctmWithdraw=()=>{const me=C.me,a=amt();if(me.role!=='vendor'&&me.role!=='dalali')return alert('Mteja hawezi kutoa pesa.');
  if(!(a>=1000)||a>me.walletBalance)return alert('Kiasi si sahihi au salio halitoshi.');if(!pwOk())return;
  me.walletBalance-=a;tx('Withdraw',-a,'Withdraw (inasubiri malipo)');C.notify(me.id,'Ombi la Kutoa Pesa','Malipo',`${fmt(a)} inashughulikiwa.`);C.persist();C.hydrate();renderCurrentTab();alert('Ombi limepokelewa');};
const _del=window.deleteStoreProduct;window.deleteStoreProduct=function(id){if(C.me&&C.me.role==='dalali')return alert('Dalali hawezi kufuta bidhaa.');_del(id);};

/* ---------- Routing + header ---------- */
const _r=window.renderCurrentTab;
window.renderCurrentTab=function(){
  const me=C.me;
  if(currentTab==='wallet'||currentTab==='broker_hub'){if(!me)currentTab='signin_page';else if(currentTab==='broker_hub'&&me.role!=='dalali')currentTab='soko';}
  if(currentTab==='sub_shops'&&me&&me.role!=='vendor')currentTab='soko';
  const c=$('main-content');if(currentTab==='wallet')c.innerHTML=renderWallet();else if(currentTab==='broker_hub')c.innerHTML=renderBrokerHub();
  _r();
};
window.addEventListener('DOMContentLoaded',()=>{const g=document.querySelector('header > div:last-child');
  if(g)g.insertAdjacentHTML('afterbegin','<button onclick="switchTab(\'wallet\')" class="p-1.5 text-sm bg-slate-900 rounded-full border border-slate-800 w-8 h-8" title="Wallet">💰</button>');});
})();

</script>
<script>
/* ===== CTM V17: Go Live (setup -> live), chumba cha live skrini nzima ===== */
(function(){
const C=window.__ctm,$=id=>document.getElementById(id),esc=C.esc,G='bg-cyan-200/10 backdrop-blur-md border border-cyan-200/30';
const L=()=>{const S=C.S;S.lives=S.lives||[];S.liveMsgs=S.liveMsgs||[];return S;};
const on=l=>l.status==='live'&&Date.now()-l.beat<45000;
const lives=()=>L().lives.filter(on);
const cur=()=>room&&L().lives.find(l=>l.id===room.id);
let cam=null,room=null,t1=null,t2=null;
const viewers=id=>new Set(L().liveMsgs.filter(m=>m.liveId===id&&m.kind==='join'&&Date.now()-m.ts<50000).map(m=>m.from)).size;
window.renderGoLive=function(){hideFloatingWidgetOnOtherPages();const mine=productsList.filter(p=>p.vendorId===C.me.id),i='w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white';
  return `<div class="p-4 space-y-3 w-full max-w-md mx-auto pb-24"><div class="flex items-center gap-2 border-b border-slate-800 pb-3"><button onclick="ctmBack(()=>{switchTab('akaunti')})" class="p-1.5 bg-slate-800 rounded-lg text-slate-300">←</button><h3 class="font-bold text-sm text-red-400">Weka Mipangilio ya Live</h3></div>
  <p class="text-[11px] text-slate-400">Jaza kwanza, kisha bonyeza "Anza Live". Live haianzi hadi ubonyeze.</p>
  <input id="lv-title" placeholder="Kichwa cha live (mf. Punguzo la leo)" class="${i}">
  <p class="text-xs text-slate-300 font-bold">Bidhaa za kuonyesha:</p>
  ${mine.map(p=>`<label class="flex items-center gap-2 text-xs text-slate-200 bg-slate-900 border border-slate-800 rounded-xl p-2"><input type="checkbox" class="lv-p" value="${p.id}" checked>${esc(p.name)} - TZS ${p.price.toLocaleString()}</label>`).join('')||'<p class="text-[11px] text-slate-500">Huna bidhaa bado (bado unaweza kwenda live).</p>'}
  <select id="lv-cam" class="${i}"><option value="user">Kamera ya mbele</option><option value="environment">Kamera ya nyuma</option></select>
  <label class="flex items-center gap-2 text-xs text-slate-200"><input id="lv-chat" type="checkbox" checked>Ruhusu watazamaji kutuma maoni</label>

<script>
/* ===== CTM V18: Mikoa/Karibu, Likes & Followers halisi, Walioona story ===== */
(function(){
const C=window.__ctm,$=id=>document.getElementById(id),esc=C.esc;
const RG={'Arusha':[-3.39,36.68],'Dar es Salaam':[-6.79,39.21],'Dodoma':[-6.16,35.75],'Mwanza':[-2.52,32.9],'Mbeya':[-8.9,33.46],'Kilimanjaro':[-3.35,37.34],'Tanga':[-5.07,39.1],'Morogoro':[-6.82,37.66],'Zanzibar':[-6.16,39.19],'Manyara':[-4.21,35.75],'Iringa':[-7.77,35.69],'Kagera':[-1.33,31.81],'Kigoma':[-4.88,29.63],'Mtwara':[-10.27,40.18],'Singida':[-4.82,34.74],'Tabora':[-5.02,32.8],'Ruvuma':[-10.68,35.65],'Shinyanga':[-3.66,33.42],'Lindi':[-9.99,39.71],'Pwani':[-6.77,38.92],'Geita':[-2.87,32.23],'Simiyu':[-2.8,33.98],'Katavi':[-6.34,31.07],'Njombe':[-9.34,34.77],'Songwe':[-9.17,32.93],'Rukwa':[-7.96,31.62],'Mara':[-1.5,33.8]};
const NAMES=Object.keys(RG),ALIAS={kinondoni:'Dar es Salaam',ilala:'Dar es Salaam',temeke:'Dar es Salaam',ubungo:'Dar es Salaam',kigamboni:'Dar es Salaam',dar:'Dar es Salaam',moshi:'Kilimanjaro',bukoba:'Kagera',musoma:'Mara',sumbawanga:'Rukwa',songea:'Ruvuma',babati:'Manyara',kibaha:'Pwani',bariadi:'Simiyu',unguja:'Zanzibar',pemba:'Zanzibar'};
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,k=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(k));};
const nearest=(la,ln)=>NAMES.reduce((b,n)=>hav(la,ln,...RG[n])<hav(la,ln,...RG[b])?n:b,NAMES[0]);
const fromText=t=>{t=(t||'').toLowerCase();for(const n of NAMES)if(t.includes(n.toLowerCase()))return n;for(const k in ALIAS)if(t.includes(k))return ALIAS[k];return null;};
let vpos=null;
const viewerRegion=()=>localStorage.getItem('ctm_region')||localStorage.getItem('ctm_region_auto')||(C.me&&(C.me.region||fromText(C.me.location)))||'Arusha';
window.ctmRegions=NAMES;window.ctmRegionSelect=()=>{const m=localStorage.getItem('ctm_region')||'';return `<select onchange="ctmSetRegion(this.value)" class="bg-slate-900 border border-slate-700 text-[11px] text-emerald-300 rounded-lg px-2 py-1"><option value="">📍 Otomatiki (${viewerRegion()})</option>${NAMES.map(n=>`<option value="${n}" ${m===n?'selected':''}>${n}</option>`).join('')}</select>`;};
window.ctmSetRegion=r=>{r?localStorage.setItem('ctm_region',r):localStorage.removeItem('ctm_region');C.hydrate();renderCurrentTab();};
const _h=window.ctmAfterHydrate;
window.ctmAfterHydrate=function(){
  if(_h)_h();const S=C.S,me=C.me,vr=viewerRegion();
  vendorsList.forEach(v=>{const a=S.accounts.find(x=>x.id===v.id)||{};
    v.homeRegion=a.region||(a.locMarked&&a.lat?nearest(a.lat,a.lng):null)||fromText(a.location)||'Arusha';
    const multi=(a.selectedRegions||[]).some(r=>r!==v.homeRegion);
    v.inNear=v.homeRegion===vr;v.inMikoani=!v.inNear||multi;v.isMikoani=!v.inNear;
    v.distanceKm=vpos&&a.locMarked&&a.lat?Math.round(hav(vpos[0],vpos[1],a.lat,a.lng)*10)/10:(v.inNear?(a.distanceKm||2):Math.round(hav(...(RG[vr]||RG.Arusha),...(RG[v.homeRegion]||RG.Arusha))));});
  if(me){currentUser.likesCount=S.reels.filter(r=>r.vendorId===me.id).reduce((n,r)=>n+(r.likes||[]).length,0)+S.stories.filter(s=>s.ownerId===me.id).reduce((n,s)=>n+(s.likes||[]).length,0);}
};
window.addEventListener('DOMContentLoaded',()=>{if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{vpos=[p.coords.latitude,p.coords.longitude];localStorage.setItem('ctm_region_auto',nearest(...vpos));if(C.S){C.hydrate();if(currentTab==='soko')renderCurrentTab();}},()=>{},{timeout:8000});});
/* ---- Orodha za watu (followers, likes, walioona story) + profile ---- */
let ov=null,last='';
const open=(title,html)=>{if(!ov){ov=document.createElement('div');ov.id='people-ov';ov.className='fixed inset-0 z-[300] bg-black/90 overflow-y-auto p-4';document.body.appendChild(ov);}
  last=html;ov.innerHTML=`<div class="max-w-md mx-auto space-y-2"><div class="flex justify-between items-center pb-2"><p class="text-white font-black text-sm">${title}</p><button onclick="ctmClosePeople()" class="text-white text-xl">✕</button></div>${html}</div>`;};
window.ctmClosePeople=()=>{if(ov){ov.remove();ov=null;}};
window.ctmOpenOverlay=open;
const row=a=>`<button onclick="ctmProfile(${a.id})" class="w-full flex items-center gap-3 bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-left"><img src="${ctmAv(a)}" class="w-10 h-10 rounded-full object-cover"><span class="flex-1 min-w-0"><b class="text-white text-xs block truncate">${esc(a.role==='vendor'||a.role==='dalali'?a.shopName:a.name)}</b><span class="text-[10px] text-slate-400">${a.role==='customer'?'Mteja':a.role==='admin'?'Admin':'Duka'}</span></span></button>`;
window.ctmShowPeople=(kind,sid)=>{const S=C.S,me=C.me;let ids=[],t='';
  if(kind==='followers'){t='Followers';ids=S.accounts.filter(a=>(a.following||[]).includes(me.id)).map(a=>a.id);}
  else if(kind==='likes'){t='Walio-like';const s=new Set();S.reels.filter(r=>r.vendorId===me.id).forEach(r=>(r.likes||[]).forEach(x=>s.add(x)));S.stories.filter(x=>x.ownerId===me.id).forEach(x=>(x.likes||[]).forEach(y=>s.add(y)));ids=[...s];}
  else if(kind==='viewers'){t='Walioona story';const st=S.stories.find(x=>x.id===sid);ids=S.accounts.filter(a=>st&&a.id!==st.ownerId&&(a.seen||[]).includes(sid)).map(a=>a.id);}
  else{t='Walio-like story';const st=S.stories.find(x=>x.id===sid);ids=(st&&st.likes)||[];}
  const l=ids.map(i=>S.accounts.find(a=>a.id===i)).filter(Boolean);
  open(`${t} (${l.length})`,l.map(row).join('')||'<p class="text-slate-400 text-xs text-center py-8">Hakuna bado.</p>');};
window.ctmProfile=id=>{const a=C.S.accounts.find(x=>x.id===id);if(!a)return;const v=a.role==='vendor'||a.role==='dalali',back=last;
  open('Profile',`<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center space-y-2"><img src="${ctmAv(a)}" class="w-20 h-20 rounded-full object-cover mx-auto"><p class="text-white font-black text-sm">${esc(v?a.shopName:a.name)}</p><p class="text-[11px] text-slate-400">${v?esc(a.name)+' - ':''}${a.role==='customer'?'Mteja':'Muuzaji'}</p>${a.location?`<p class="text-[11px] text-slate-300">📍 ${esc(a.location)}</p>`:''}${a.joined?`<p class="text-[10px] text-slate-500">Alijiunga: ${esc(a.joined)}</p>`:''}${a.bio?`<p class="text-[11px] text-slate-300">${esc(a.bio)}</p>`:''}</div>
  <div class="flex gap-2">${C.me&&C.me.id!==id?`<button onclick="ctmClosePeople();ctmChatWith(${id})" class="flex-1 bg-emerald-500 text-slate-950 font-extrabold py-2.5 rounded-xl text-xs">Ujumbe</button>`:''}${v?`<button onclick="ctmClosePeople();openVendorProducts(${id})" class="flex-1 bg-slate-800 text-emerald-400 font-bold py-2.5 rounded-xl text-xs">Angalia Duka</button>`:''}</div>`);last=back;};
})();

</script>
<script>
/* ===== CTM V19: ticks, voice note, picha chat, qty+note kikapu, usimamizi wa reels/story, uchunguzi wa maduka ===== */
(function(){
const C=window.__ctm,$=id=>document.getElementById(id),esc=C.esc;
window.ctmTick=(c,m,o)=>{if(((c.read&&c.read[o.id])||0)>=m.ts)return ' <span class="text-sky-400 font-black">✓✓</span>';return ' <span class="text-slate-400">'+(ctmDot(o.id)?'✓✓':'✓')+'</span>';};
const shrink=(d,max=800,q=.6)=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};i.onerror=rej;i.src=d;});
const sendExtra=extra=>{const S=C.S,c=S.chats.find(x=>x.id===activeChatId);if(!c)return;(S.msgs[c.id]=S.msgs[c.id]||[]).push(Object.assign({from:C.me.id,text:'',ts:Date.now()},extra));c.ts=Date.now();c.read=c.read||{};c.read[C.me.id]=Date.now();C.persist();C.hydrate();renderCurrentTab();};
window.ctmAttach=()=>{let f=$('chat-file');if(!f){f=document.createElement('input');f.type='file';f.id='chat-file';f.accept=window.CTM_CLOUD_MEDIA?'image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx':'image/*,.pdf,.txt,.doc,.docx';f.style.display='none';document.body.appendChild(f);}
  f.onchange=()=>{const x=f.files[0];f.value='';if(!x)return;const r=new FileReader();r.onload=async()=>{try{
    if(x.type.startsWith('image/'))return sendExtra({att:{type:'image',name:x.name,data:await shrink(r.result)}});
    const lim=window.CTM_CLOUD_MEDIA?25*1024*1024:150*1024;if(x.size>lim)return alert('Faili ni kubwa (max '+(window.CTM_CLOUD_MEDIA?'25MB':'150KB, weka Cloudinary kwa mafaili makubwa')+').');sendExtra({att:{type:x.type.startsWith('video/')?'video':x.type.startsWith('audio/')?'audio':'file',name:x.name,data:r.result}});}catch(e){alert('Imeshindwa kutuma faili.');}};r.readAsDataURL(x);};f.click();};
let rec=null,chunks=[],tm=null;
window.ctmVoice=async()=>{const b=$('vn-btn');if(rec){rec.stop();return;}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}),mt=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';
    rec=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{clearTimeout(tm);st.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;const bb=$('vn-btn');if(bb){bb.textContent='🎤';bb.classList.remove('bg-red-600');}
      const r=new FileReader();r.onload=()=>sendExtra({att:{type:'audio',name:'voice',data:r.result}});r.readAsDataURL(blob);};
    rec.start();if(b){b.textContent='⏹';b.classList.add('bg-red-600');}tm=setTimeout(()=>rec&&rec.stop(),45000);
  }catch(e){alert('Ruhusu maikrofoni ili kutuma voice note.');}};
/* ---- Kikapu: idadi + maelezo ---- */
window.ctmCartRows=()=>{const seen={},rows=[];cartItems.forEach((it,i)=>{if(seen[it.id]===undefined){seen[it.id]=rows.length;rows.push({item:it,index:i,qty:1});}else rows[seen[it.id]].qty++;});return rows;};
window.ctmQtySet=(id,q)=>{q=Math.floor(+q);const r=ctmCartRows().find(x=>x.item.id===id);if(!r)return;const p=productsList.find(x=>x.id===id),cur=r.qty,fn=window.CTM_USE_FN;
  const max=p?(fn?p.stock:cur+p.stock):cur;q=Math.max(1,Math.min(isFinite(q)?q:1,max));
  while(cartItems.filter(i=>i.id===id).length<q){cartItems.push(Object.assign({},r.item));if(p&&!fn)p.stock--;}
  while(cartItems.filter(i=>i.id===id).length>q){cartItems.splice(cartItems.map(i=>i.id).lastIndexOf(id),1);if(p&&!fn)p.stock++;}
  saveToOfflineCache();openCart();};
window.ctmRemoveAll=id=>{const p=productsList.find(x=>x.id===id),n=cartItems.filter(i=>i.id===id).length;if(p&&!window.CTM_USE_FN)p.stock+=n;cartItems=cartItems.filter(i=>i.id!==id);saveToOfflineCache();openCart();};
window.ctmSaveNote=v=>{if(!C.me)return;C.me.cartNote=String(v).replace(/[<>"'`]/g,'').slice(0,300);C.persist();};
/* ---- Reels & stories zangu ---- */
window.ctmDelReel=id=>ctmAsk('Futa reel hii? Itaondolewa kwa kila mtu.',()=>{const S=C.S;S.reels=S.reels.filter(r=>!(r.id===id&&r.vendorId===C.me.id));C.persist();C.hydrate();renderCurrentTab();});
window.ctmDelStory=id=>ctmAsk('Futa story hii kwa kila mtu?',()=>{const S=C.S;S.stories=S.stories.filter(s=>!(s.id===id&&s.ownerId===C.me.id));C.persist();C.hydrate();ctmCloseStory();});
window.ctmMyReels=()=>{const S=C.S,me=C.me,rs=S.reels.filter(r=>r.vendorId===me.id),ss=S.stories.filter(s=>s.ownerId===me.id&&Date.now()-s.ts<864e5);
  const row=(img,t,l,f)=>`<div class="flex items-center gap-3 bg-slate-900 border border-slate-800 rounded-xl p-2"><img src="${img||''}" class="w-14 h-14 rounded-lg object-cover bg-slate-800"><div class="flex-1 min-w-0"><p class="text-white text-xs font-bold truncate">${esc(t)}</p><p class="text-[10px] text-slate-400">❤ ${l}</p></div><button onclick="${f}" class="text-red-400 text-lg px-2">🗑</button></div>`;
  ctmOpenOverlay('Reels & Stories Zangu',rs.map(r=>row(r.thumbnail,r.title||'Reel',(r.likes||[]).length,`ctmDelReel(${r.id});ctmMyReels()`)).join('')+ss.map(s=>row(s.img||s.mediaUrl,'Story: '+(s.text||''),(s.likes||[]).length,`ctmDelStory(${s.id});ctmMyReels()`)).join('')||'<p class="text-slate-400 text-xs text-center py-8">Huna reels wala stories.</p>');};
/* ---- Soko: tabs + uchunguzi ---- */
window.ctmTab=x=>{showMikoaniOnly=!!x;renderCurrentTab();};


/* ---- Stock inapoisha: tahadhari + kuongeza ---- */
const _hh=window.ctmAfterHydrate;
window.ctmAfterHydrate=function(){if(_hh)_hh();const me=C.me,S=C.S;if(!me||me.role!=='vendor')return;const d=new Date().toDateString();me.lowNote=me.lowNote||{};let dirty=false;
  S.products.filter(p=>p.vendorId===me.id&&p.stock<=3).forEach(p=>{const k=d+':'+p.stock;if(me.lowNote[p.id]!==k){me.lowNote[p.id]=k;C.notify(me.id,p.stock?'Bidhaa Inakaribia Kuisha':'Bidhaa Imeisha','Huduma',esc(p.name)+' imebaki '+p.stock+'. Ongeza stock.');dirty=true;}});if(dirty)C.persist();};
const _rvo=window.renderVendorOrders;
window.renderVendorOrders=function(){const me=C.me,l=C.S.products.filter(p=>p.vendorId===me.id&&p.stock<=3);
  const b=l.length?`<div class="p-4 pb-0 max-w-md md:max-w-xl mx-auto"><div class="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-3 space-y-2"><p class="text-xs font-bold text-amber-300">Bidhaa zinazoisha (${l.length})</p>${l.map(p=>`<div class="flex items-center justify-between text-[11px] text-slate-200"><span>${esc(p.name)} - zimebaki <b class="${p.stock?'text-amber-300':'text-red-400'}">${p.stock}</b></span><button onclick="ctmRestock(${p.id})" class="bg-emerald-500 text-slate-950 font-extrabold px-3 py-1 rounded-lg">+ Ongeza</button></div>`).join('')}</div></div>`:'';return b+_rvo();};
window.ctmRestock=id=>{const p=C.S.products.find(x=>x.id===id);if(!p||p.vendorId!==C.me.id)return;ctmPrompt('Ongeza idadi ngapi?','10',v=>{const n=Math.floor(+v);if(!(n>0))return;p.stock+=n;C.persist();C.hydrate();renderCurrentTab();});};

/* ---- Vigezo na Masharti + Kuhusu Sisi ---- */

['1. Utangulizi na Kukubali Masharti',['Kwa kusajili akaunti au kutumia programu ya Closer to Market (CTM), mtumiaji (Muuzaji, Mnunuzi, au Dalali) anakubali kufungwa na Vigezo na Masharti haya. Kama hakubaliani nayo, hapaswi kutumia mfumo huu.']],

['4. Usimamizi wa Madalali na Sub-shops',['Wajibu wa Mmiliki: Wamiliki wa maduka wakuu wanawajibika kikamilifu kwa miamala na tabia za Madalali au Sub-shops walizowaajiri chini ya ofisi zao (Subshop Office & Control).','CTM haitahusika na migogoro ya ndani ya kimaslahi kati ya mmiliki wa duka na dalali wake.']],
['5. Usalama wa Pochi ya Kidijitali (Wallet na Namba ya Siri)',['Ulinzi wa Namba ya Siri: Mtumiaji anawajibika kulinda namba yake ya siri. CTM haitahusika na upotevu wa pesa unaotokana na uzembe wa mtumiaji kumpa mtu mwingine namba yake ya siri.','Miamala: Pesa zilizowekwa kwenye Wallet (Deposit) zitatumika tu kwa shughuli za ndani ya mfumo kulingana na miongozo ya soko.']],

];

['Sisi ni nani',['Closer to Market (CTM) ni soko la mtandaoni linalokuunganisha na wauzaji walio karibu nawe, na pia wa mikoa mingine ya Tanzania. Lengo letu ni kuwarahisishia wafanyabiashara kuonyesha bidhaa zao na kuwafikia wateja wengi zaidi, na wateja kununua kwa uhakika kutoka kwa maduka wanayoyaamini.']],

<script>
/* ===== CTM V26: kitufe cha kurudi (browser/simu) kinarudisha mahali ulipotoka ===== */
(function(){
const C=window.__ctm;
let navId=0,restoring=false,lastKey=null,suppress=false;
const scrolls=new Map(),ovStack=[],byBack=new Set();
const snap=()=>({tab:currentTab,chat:typeof activeChatId!=='undefined'?activeChatId:null,store:window.ctmStoreId||null,q:window.ctmSearchQ||'',bsec:window.brokerSec||'',mik:typeof showMikoaniOnly!=='undefined'?!!showMikoaniOnly:false});
const key=s=>[s.tab,s.chat||'',s.store||'',s.tab==='search_results'?'':s.q,s.bsec,s.tab==='soko'?s.mik:''].join('|');
const sc=()=>{const mc=document.getElementById('main-content');return {y:window.scrollY||document.documentElement.scrollTop||0,my:mc?mc.scrollTop:0};};
/* ---- Kurasa (tabs na ndani yake) ---- */
const _rc=window.renderCurrentTab;
window.renderCurrentTab=function(){const pre=sc();_rc();if(restoring)return;const s=snap(),k=key(s);
  if(lastKey===null){lastKey=k;try{history.replaceState({nav:navId,view:s},'');}catch(e){}return;}
  if(k!==lastKey){scrolls.set(navId,pre);navId++;lastKey=k;try{history.pushState({nav:navId,view:s},'');}catch(e){}}};
window.ctmBack=fb=>{if(navId>0)history.back();else{try{fb&&fb();}catch(e){}}};
/* ---- Madirisha (overlays) ---- */
const CL={'people-ov':()=>window.ctmClosePeople(),'story-ov':()=>window.ctmCloseStory(),'ss-ov':()=>window.ctmSSClose(),'scanner-modal':()=>window.closeScannerModal(),'zoom-modal':()=>window.closeZoomModal(),
  'live-ov':()=>{if(window.ctmLiveHost&&ctmLiveHost()){history.pushState({ov:'live-ov',nav:navId},'');ctmAsk('Maliza live? Utaondoa watazamaji wote.',()=>ctmLeaveLive());}else ctmLeaveLive();}};
const closeId=id=>{const el=document.getElementById(id);if(CL[id])CL[id](el);else if(el)el.remove();};
const OVID=['people-ov','story-ov','ss-ov','ts-ov','mv-ov','live-ov','live-list','bj','ai-ov','dlg-ov'];
let auto=0;
const idOf=n=>{if(!(n instanceof HTMLElement))return null;if(OVID.includes(n.id)||/^ov_auto/.test(n.id))return n.id;
  if(n.parentNode===document.body&&/(^|\s)fixed(\s|$)/.test(n.className||'')&&/inset-0/.test(n.className||'')&&!['ctm-toast','pwa-bar','ctm-err','ver-bar','role-ov'].includes(n.id)){n.id=n.id||('ov_auto_'+(++auto));return n.id;}return null;};
const opened=id=>{ovStack.push(id);try{history.pushState({ov:id,nav:navId},'');}catch(e){}};
const closed=id=>{const i=ovStack.lastIndexOf(id);if(i>=0)ovStack.splice(i,1);if(byBack.has(id)){byBack.delete(id);return;}
  if(history.state&&history.state.ov===id){suppress=true;history.back();}};
new MutationObserver(ms=>{const add=new Set(),rem=new Set();ms.forEach(m=>{m.addedNodes.forEach(n=>{const i=idOf(n);if(i)add.add(i);});m.removedNodes.forEach(n=>{if(n instanceof HTMLElement&&(OVID.includes(n.id)||/^ov_auto/.test(n.id)))rem.add(n.id);});});
  add.forEach(i=>{if(!rem.has(i))opened(i);});rem.forEach(i=>{if(!add.has(i))closed(i);});}).observe(document.body,{childList:true});
window.addEventListener('DOMContentLoaded',()=>{['scanner-modal','zoom-modal'].forEach(id=>{const el=document.getElementById(id);if(!el)return;let on=false;
  new MutationObserver(()=>{const v=getComputedStyle(el).display!=='none';if(v&&!on){on=true;opened(id);}else if(!v&&on){on=false;closed(id);}}).observe(el,{attributes:true,attributeFilter:['style','class']});});});
/* ---- popstate ---- */
window.addEventListener('popstate',e=>{
  if(suppress){suppress=false;return;}
  if(ovStack.length){const id=ovStack[ovStack.length-1];byBack.add(id);closeId(id);if(id!=='live-ov'||!(window.ctmLiveHost&&ctmLiveHost())){} return;}
  const st=e.state;if(!st)return;
  if(st.ov){history.back();return;}                      /* kipande cha dirisha kilichobaki: ruka */
  if(!st.view)return;const v=st.view;restoring=true;
  currentTab=v.tab;if(typeof activeChatId!=='undefined')activeChatId=v.chat;window.ctmStoreId=v.store;window.ctmSearchQ=v.q;window.brokerSec=v.bsec;if(typeof showMikoaniOnly!=='undefined')showMikoaniOnly=v.mik;
  navId=st.nav;lastKey=key(v);try{renderCurrentTab();}finally{restoring=false;}
  const s=scrolls.get(st.nav),go=()=>{if(!s)return;window.scrollTo(0,s.y);const mc=document.getElementById('main-content');if(mc)mc.scrollTop=s.my;};setTimeout(go,0);setTimeout(go,150);});
})();

</script>

/* ---- Push (FCM) ---- */
const VAPID='PASTE_VAPID_KEY_HERE';let pushed=false;
window.addEventListener('click',async()=>{if(pushed||!C.me)return;pushed=true;
  try{if(!(await isSupported())||VAPID.startsWith('PASTE'))return;if(Notification.permission==='default')await Notification.requestPermission();if(Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js'),m=getMessaging(app),tok=await getToken(m,{vapidKey:VAPID,serviceWorkerRegistration:reg}),me=C.me;
    if(tok&&!(me.fcmTokens||[]).includes(tok)){me.fcmTokens=[...(me.fcmTokens||[]),tok].slice(-5);C.persist();}
    onMessage(m,p=>alert((p.notification&&p.notification.title)||'Taarifa mpya'));}catch(e){console.warn('push',e);}});
