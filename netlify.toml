[build]
  publish = "public"
  functions = "netlify/functions"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ctm/:splat"
  status = 200
[[redirects]]
  from = "/api/fn/*"
  to = "/.netlify/functions/fn/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/api/lk"
  to = "/.netlify/functions/lk"
  status = 200
  force = true
