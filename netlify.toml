[build]
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  # Public project identifier also used by Firebase deployment and Android metadata.
  # Keep scanning API keys, app IDs, service-account credentials and all other values.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "firebase-functions"]
[functions."push-sweep"]
  schedule = "* * * * *"

[[redirects]]
  from = "/firebase-config.js"
  to = "/.netlify/functions/firebase-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/fn/*"
  to = "/.netlify/functions/fn/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/api/lk"
  to = "/.netlify/functions/lk"
  status = 200
  force = true
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ctm/:splat"
  status = 200
  force = true
